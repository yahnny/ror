[package]
name = "ror-cli"
description = "ror command-line tool: status, reload, quit, start, edit, version."
version.workspace = true
edition.workspace = true

# The package is `ror-cli` but the exe is `ror.exe`.
[[bin]]
name = "ror"
path = "src/main.rs"

# Windows-only: on other platforms main() just says so.
[target.'cfg(windows)'.dependencies]
ror-core.workspace = true
ror-win.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
