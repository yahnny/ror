[package]
name = "rord"
description = "ror listener: registers the hotkeys and switches windows."
version.workspace = true
edition.workspace = true

# Windows-only: on other platforms main() just says so.
[target.'cfg(windows)'.dependencies]
ror-core.workspace = true
ror-win.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
